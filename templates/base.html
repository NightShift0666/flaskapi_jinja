<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo_pagina %}Gestión de Proyectos{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f9fafb;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #ffffff;
            box-shadow: 2px 0 6px rgba(0, 0, 0, 0.05);
            padding: 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
        }

        .sidebar h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
            color: #0d6efd;
        }

        .sidebar a {
            display: block;
            padding: 10px 15px;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 5px;
            transition: all 0.2s ease;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #0d6efd;
            color: #fff;
        }

        .sidebar hr {
            margin: 20px 0;
            border-color: #eee;
        }

        /* Contenido principal */
        main {
            margin-left: 250px;
            padding: 40px;
            flex: 1;
        }

        footer {
            text-align: center;
            padding: 20px 0;
            font-size: 0.9rem;
            color: #666;
            border-top: 1px solid #eee;
            margin-top: 40px;
        }

        @media (max-width: 992px) {
            .sidebar {
                width: 200px;
                padding: 15px;
            }
            main {
                margin-left: 200px;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2><i class="bi bi-kanban"></i> Proyectos</h2>
        <nav>
            <a href="{{ url_for('inicio') }}"><i class="bi bi-house-door"></i> Inicio</a>
            <a href="{{ url_for('acerca') }}"><i class="bi bi-info-circle"></i> Acerca</a>
            <hr>
            <a href="{{ url_for('rutas_entregables.entregables') }}"><i class="bi bi-box-seam"></i> Entregables</a>
            <a href="{{ url_for('rutas_tipos_proyecto.tipos_proyecto') }}"><i class="bi bi-diagram-3"></i> Tipos de proyecto</a>
            <a href="{{ url_for('rutas_tipos_producto.tipos_producto') }}"><i class="bi bi-layers"></i> Tipos de producto</a>
            <a href="{{ url_for('rutas_tipos_responsable.tipos_responsable') }}"><i class="bi bi-person-badge"></i> Tipos de responsable</a>
            <a href="{{ url_for('rutas_variables_estrategicas.variables_estrategicas') }}"><i class="bi bi-graph-up"></i> Variables estratégicas</a>
            <a href="{{ url_for('rutas_usuarios.usuarios') }}"><i class="bi bi-people"></i> Usuarios</a>
            <a href="{{ url_for('rutas_estados.estados') }}"><i class="bi bi-flag"></i> Estados</a>
        </nav>
    </aside>

    <!-- Contenido principal -->
    <main>
        {% block contenido %}{% endblock %}
        <footer>
            <p>© 2025 Gestión de Proyectos | Flask + Jinja2</p>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
